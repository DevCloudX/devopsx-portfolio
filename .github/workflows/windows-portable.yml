name: Build DevOpsX Windows Portable App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portable Windows app
        run: npm run build:windows
      - name: Upload portable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevOpsX-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
