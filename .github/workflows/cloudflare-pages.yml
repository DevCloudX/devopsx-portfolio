name: Cloudflare Pages - DevOpsX previews and production

on:
  push:
    branches:
      - feature/cloudflare-pages
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static application
        run: npm run build
      - name: Validate Cloudflare configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [[ "$DEPLOY_REF" != "refs/heads/main" && "$DEPLOY_REF" != "refs/heads/feature/cloudflare-pages" ]]; then
            echo "::error::Cloudflare deployment is allowed only from main or feature/cloudflare-pages."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_PAGES_PROJECT" ]]; then
            echo "::error::Add the CLOUDFLARE_PAGES_PROJECT repository variable."
            exit 1
          fi
      - name: Deploy Cloudflare Pages build
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" --branch "${{ github.ref_name }}"
